# ============================================================
# Build system
# ============================================================
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


# ============================================================
# Project metadata
# ============================================================
[project]
name = "sqldbunify"
version = "0.1.0"
description = "Universal async DAO wrapper for SQLAlchemy with advanced filtering and joins"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tsyganov Pavel", email = "jsfelix83@gmail.com" }
]
keywords = [
    "sqlalchemy",
    "dao",
    "async",
    "database",
    "orm",
    "wrapper",
    "crud",
    "asyncio",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Framework :: SQLAlchemy",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# ============================================================
# Runtime dependencies (user install with pip)
# ============================================================
dependencies = [
    "sqlalchemy>=2.0.0",
]

# ============================================================
# Optional dependencies (db drivers, dev tools)
# ============================================================
[project.optional-dependencies]
sqlite     = ["aiosqlite"]
postgresql = ["asyncpg"]
mysql      = ["asyncmy"]
mssql      = ["aioodbc"]
oracle     = ["oracledb"]
all        = ["aiosqlite", "asyncpg", "asyncmy", "aioodbc", "oracledb"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "build>=1.0",
    "twine>=4.0",
]

# ============================================================
# Project URLs
# ============================================================
[project.urls]
Homepage     = "https://github.com/tsy-pavel/sqldbunify"
Repository   = "https://github.com/tsy-pavel/sqldbunify.git"
Issues       = "https://github.com/tsy-pavel/sqldbunify/issues"
Changelog    = "https://github.com/tsy-pavel/sqldbunify/blob/main/CHANGELOG.md"


# ============================================================
# Setuptools: find packages (src-layout)
# ============================================================
[tool.setuptools.packages.find]
where = ["src"]
include = ["sqldbunify*"]


# ============================================================
# Ruff
# ============================================================
[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "_build",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length (handled by line-length) 
]

[tool.ruff.lint.per-file-ignores]
"__init__.py"  = ["F401"]  # re-exports in __init__.py
"tests/*"      = ["S101", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["sqldbunify"]


# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow",
]


# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["src/sqldbunify"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
